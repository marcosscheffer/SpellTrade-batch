services:
    postgres:
        image: postgres:17
        container_name: cards-postgres

        environment:
            - POSTGRES_DB=spelltrade
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres

        ports:
            - "5432:5432"

        volumes:
            - postgres-data:/var/lib/postgresql/data
    
    pgadmin:
        image: dpage/pgadmin4
        container_name: cards-pgadmin

        environment:
            - PGADMIN_DEFAULT_EMAIL=admin@admin.com
            - PGADMIN_DEFAULT_PASSWORD=admin
        
        ports:
            - "5050:80"

        depends_on:
            - postgres
    
    cards-batch:
        build: .

        container_name: cards-batch

        depends_on:
            - postgres
        
        environment:
            - DB_URL=jdbc:postgresql://postgres:5432/spelltrade
            - DB_USER=postgres
            - DB_PASSWORD=postgres

volumes:
    postgres-data: